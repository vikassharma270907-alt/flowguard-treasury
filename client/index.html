    <!-- Zero-Flash Color Scheme & Theme Initialization Script -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0b0c" id="theme-color-meta" />
    <script>
      (function() {
        // 1. Restore Language
        try {
          var cookieMatch = document.cookie.match(/(?:^|; )preferred-lang=([^;]*)/);
          var lang = cookieMatch ? decodeURIComponent(cookieMatch[1]) : localStorage.getItem('preferred-lang');
          if (lang === 'hi' || lang === 'en') {
            document.documentElement.lang = lang;
          }
        } catch (e) {}

        // 2. Zero-flash Theme Restore: Cookie -> localStorage -> System OS
        try {
          var themeCookie = document.cookie.match(/(?:^|; )preferred-theme=([^;]*)/);
          var saved = themeCookie ? decodeURIComponent(themeCookie[1]) : (localStorage.getItem('preferred-theme') || localStorage.getItem('flowguard-theme') || 'system');
          
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'dark') {
            isDark = true;
          } else {
            // 'system' or unset
            isDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          var resolved = isDark ? 'dark' : 'light';
          var docEl = document.documentElement;
          docEl.classList.remove('light', 'dark');
          docEl.classList.add(resolved);
          docEl.setAttribute('data-theme', resolved);
          docEl.setAttribute('data-theme-setting', saved);
          docEl.style.colorScheme = resolved;

          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', isDark ? '#0b0b0c' : '#ffffff');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>

<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <title>BeyondFlow | Autonomous Treasury & Intent Vault Governed by ArmorIQ</title>
    <meta name="description" content="BeyondFlow is an autonomous treasury agent and intent vault where ArmorIQ cryptographically enforces every real-world action against declared intent." />
    
    <!-- Open Graph & Social Cards (1200x630 PNG) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BeyondFlow | Autonomous Treasury & Intent Vault Governed by ArmorIQ" />
    <meta property="og:description" content="Cryptographically governed autonomous treasury and MCP intent vault powered by ArmorIQ. Prevents prompt injection, agent drift, and unauthorized disbursements." />
    <meta property="og:url" content="https://flowguard-treasury.vercel.app" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeyondFlow | Autonomous Treasury & Intent Vault" />
    <meta name="twitter:description" content="Cryptographically governed autonomous treasury and MCP intent vault powered by ArmorIQ." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Structured Data with BeyondFlow Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BeyondFlow",
      "url": "https://flowguard-treasury.vercel.app",
      "logo": "https://flowguard-treasury.vercel.app/og-image.png",
      "email": "support@beyondflow.io",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Indore",
        "addressRegion": "Madhya Pradesh",
        "addressCountry": "India"
      }
    }
    </script>
    
    <!-- Self-hosted fonts (vendored via scripts/vendor-fonts.mjs). Preload the
         faces used above the fold so first paint already has brand typography. -->
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-600-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      (function() {
        try {
          var cookieMatch = document.cookie.match(/(?:^|; )preferred-lang=([^;]*)/);
          var lang = cookieMatch ? decodeURIComponent(cookieMatch[1]) : localStorage.getItem('preferred-lang');
          if (lang === 'hi' || lang === 'en') {
            document.documentElement.lang = lang;
          }
        } catch (e) {}

        try {
          var themeCookie = document.cookie.match(/(?:^|; )(?:beyondflow-theme|flowguard-theme)=([^;]*)/);
          var saved = themeCookie ? decodeURIComponent(themeCookie[1]) : (localStorage.getItem('beyondflow-theme') || localStorage.getItem('flowguard-theme'));
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
